version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: clinic_intake_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123"
      POSTGRES_DB: clinic_intake
    ports:
      - "5435:5432"
    volumes:
      - clinic_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  clinic_pgdata:
